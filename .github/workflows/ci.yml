name: application-checks
on: [push, pull_request]
jobs:
  local-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -r backend/requirements.lock
          backend/.venv/bin/python -m pip install --no-deps -e backend
          backend/.venv/bin/python -m ruff check backend/app backend/tests backend/migrations scripts
          backend/.venv/bin/python -m pytest backend/tests -q
          backend/.venv/bin/python scripts/evaluate.py
      - run: npm ci && npm run format:check && npm run build && npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend
