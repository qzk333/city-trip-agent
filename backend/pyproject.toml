[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "city-trip-agent"
version = "0.1.0.dev0"
description = "A constraint-aware city itinerary assistant"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<2.1", "alembic>=1.14,<2", "httpx>=0.28,<1",
  "langgraph>=1,<2", "psycopg[binary]>=3.2,<4", "tzdata>=2025.1", "ddgs==9.16.0"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
